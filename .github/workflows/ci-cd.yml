name: CI/CD Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculer la version
        id: vars
        run: echo "tag=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest

  deploy-local:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Déployer avec Docker Compose
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ github.event.repository.name }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Vérification de santé
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Application OK : http://localhost:3000"; exit 0
            fi
            sleep 3
          done
          echo "Échec du health check"; docker compose logs --tail=50; exit 1
