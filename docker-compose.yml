services:
  portfolio:
    image: ${DOCKERHUB_USER}/${IMAGE_NAME}:${TAG:-latest}
    container_name: portfolio
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
